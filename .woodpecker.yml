steps:
  build-artifacts:
    image: golang:1.26-trixie
    timeout: 2h
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/rfad-artifacts:/export
    commands:
      - apt-get update && apt-get install -y curl docker.io build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev file
      - curl -fsSL https://deb.nodesource.com/setup_26.x | bash -
      - apt-get install -y nodejs

      - go install github.com/wailsapp/wails/v3/cmd/wails3@latest
      - DOCKER_BUILDKIT=1 wails3 task setup:docker
      - wails3 task linux:package

      - echo "Вшиваем процессы WebKit напрямую в AppImage..."
      - cd bin
      - ./rfadlauncherlinux-x86_64.AppImage --appimage-extract

      # 1. Копируем недостающие исполняемые файлы WebKit внутрь AppImage
      - mkdir -p squashfs-root/usr/lib/x86_64-linux-gnu/webkitgtk-6.0
      - cp -r /usr/lib/x86_64-linux-gnu/webkitgtk-6.0/* squashfs-root/usr/lib/x86_64-linux-gnu/webkitgtk-6.0/

      # 2. Вшиваем переменную WEBKIT_EXEC_PATH прямо в bash-загрузчик AppRun (до старта Go)
      - sed -i '2i export WEBKIT_EXEC_PATH="$APPDIR/usr/lib/x86_64-linux-gnu/webkitgtk-6.0"' squashfs-root/AppRun

      # 3. Скачиваем упаковщик и пересобираем починенный AppImage
      - curl -fSL -o appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
      - chmod +x appimagetool-x86_64.AppImage
      - rm rfadlauncherlinux-x86_64.AppImage
      - ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run squashfs-root rfadlauncherlinux-x86_64.AppImage
      - rm -rf squashfs-root appimagetool-x86_64.AppImage
      - cd ..
      # ================================

      - cp -r bin/* /export/

      - |
        if [ ! -f "CHANGELOG.md" ]; then
          echo "$CI_COMMIT_MESSAGE" > CHANGELOG.md
        fi
  # ==========================================
  # === БЛОК 1: ТЕСТИРОВАНИЕ ARCH-LINUX ===
  # ==========================================

  test-cachyos-zst:
    image: cachyos/cachyos:latest
    commands:
      - pacman -Syu --noconfirm libx11 wayland harfbuzz fribidi mesa libdrm fontconfig
      - pacman -U --noconfirm bin/RFADLauncherLinux.pkg.tar.zst
      - ldd /usr/bin/RFADLauncherLinux | grep -q "not found" && { ldd /usr/bin/RFADLauncherLinux | grep "not found"; exit 1; } || echo "CachyOS ZST OK!"
    when: &test_conditions
      - event: [push, pull_request]
        evaluate: 'not (CI_COMMIT_MESSAGE contains "[skip tests]")'

  test-cachyos-appimage:
    image: cachyos/cachyos:latest
    commands:
      - pacman -Syu --noconfirm libx11 wayland harfbuzz fribidi mesa libdrm fontconfig freetype2 alsa-lib
      - chmod +x bin/rfadlauncherlinux-x86_64.AppImage
      - ./bin/rfadlauncherlinux-x86_64.AppImage --appimage-extract
      - export LD_LIBRARY_PATH=$(pwd)/squashfs-root/usr/lib:$LD_LIBRARY_PATH
      - ldd squashfs-root/usr/bin/RFADLauncherLinux | grep -q "not found" && { ldd squashfs-root/usr/bin/RFADLauncherLinux | grep "not found"; exit 1; } || echo "CachyOS AppImage OK!"
    when: *test_conditions

  test-garuda-zst:
    image: archlinux:latest # База Garuda
    commands:
      - pacman -Syu --noconfirm libx11 wayland harfbuzz fribidi mesa libdrm fontconfig
      - pacman -U --noconfirm bin/RFADLauncherLinux.pkg.tar.zst
      - ldd /usr/bin/RFADLauncherLinux | grep -q "not found" && { exit 1; } || echo "Garuda ZST OK!"
    when: *test_conditions

  test-manjaro-zst:
    image: manjarolinux/base:latest
    commands:
      - pacman -Syu --noconfirm libx11 wayland harfbuzz fribidi mesa libdrm fontconfig
      - pacman -U --noconfirm bin/RFADLauncherLinux.pkg.tar.zst
      - ldd /usr/bin/RFADLauncherLinux | grep -q "not found" && { exit 1; } || echo "Manjaro ZST OK!"
    when: *test_conditions

  test-steamos-appimage:
    image: archlinux:latest # SteamOS 3.x основан на Arch, файловая система read-only, поэтому тестируем только AppImage
    commands:
      - pacman -Syu --noconfirm libx11 wayland harfbuzz fribidi mesa libdrm fontconfig freetype2 alsa-lib
      - chmod +x bin/rfadlauncherlinux-x86_64.AppImage
      - ./bin/rfadlauncherlinux-x86_64.AppImage --appimage-extract
      - export LD_LIBRARY_PATH=$(pwd)/squashfs-root/usr/lib:$LD_LIBRARY_PATH
      - ldd squashfs-root/usr/bin/RFADLauncherLinux | grep -q "not found" && { exit 1; } || echo "SteamOS AppImage OK!"
    when: *test_conditions

  # ==========================================
  # === БЛОК 2: ТЕСТИРОВАНИЕ UBUNTU/DEBIAN ===
  # ==========================================

  test-ubuntu-deb:
    image: ubuntu:24.04
    environment:
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update && apt-get install -y ./bin/RFADLauncherLinux.deb
      - ldd /usr/bin/RFADLauncherLinux | grep -q "not found" && { exit 1; } || echo "Ubuntu DEB OK!"
    when: *test_conditions

  test-ubuntu-appimage:
    image: ubuntu:24.04
    environment:
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update && apt-get install -y file libx11-6 libwayland-client0 libharfbuzz0b libfribidi0 libegl1 libgl1 libdrm2 libfontconfig1 libfreetype6 libasound2t64 libgbm1
      - apt-get update && apt-get install -y file
      - chmod +x bin/rfadlauncherlinux-x86_64.AppImage
      - ./bin/rfadlauncherlinux-x86_64.AppImage --appimage-extract
      - export LD_LIBRARY_PATH=$(pwd)/squashfs-root/usr/lib:$LD_LIBRARY_PATH
      - ldd squashfs-root/usr/bin/RFADLauncherLinux | grep -q "not found" && { exit 1; } || echo "Ubuntu AppImage OK!"
    when: *test_conditions

  test-debian-deb:
    image: debian:12-slim
    environment:
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update && apt-get install -y ./bin/RFADLauncherLinux.deb
      - ldd /usr/bin/RFADLauncherLinux | grep -q "not found" && { exit 1; } || echo "Debian DEB OK!"
    when: *test_conditions

  # ==========================================
  # === БЛОК 3: ТЕСТИРОВАНИЕ FEDORA ===
  # ==========================================

  test-fedora-rpm:
    image: fedora:40
    commands:
      - dnf install -y ./bin/RFADLauncherLinux.rpm
      - ldd /usr/bin/RFADLauncherLinux | grep -q "not found" && { exit 1; } || echo "Fedora RPM OK!"
    when: *test_conditions

  test-fedora-appimage:
    image: fedora:40
    commands:
      - dnf install -y file libX11 wayland harfbuzz fribidi mesa-libEGL mesa-libGL libdrm fontconfig freetype alsa-lib mesa-libgbm
      - chmod +x bin/rfadlauncherlinux-x86_64.AppImage
      - ./bin/rfadlauncherlinux-x86_64.AppImage --appimage-extract
      - export LD_LIBRARY_PATH=$(pwd)/squashfs-root/usr/lib:$LD_LIBRARY_PATH
      - ldd squashfs-root/usr/bin/RFADLauncherLinux | grep -q "not found" && { exit 1; } || echo "Fedora AppImage OK!"
    when: *test_conditions

  # ==========================================
  # === БЛОК 4: ПУБЛИКАЦИЯ ===
  # ==========================================

  publish-github:
    image: woodpeckerci/plugin-release
    settings:
      api_key:
        from_secret: github_token
      files:
        - bin/RFADLauncherLinux
        - bin/rfadlauncherlinux-x86_64.AppImage
        - bin/RFADLauncherLinux.deb
        - bin/RFADLauncherLinux.rpm
        - bin/RFADLauncherLinux.pkg.tar.zst
      title: "RFAD Launcher ${CI_COMMIT_TAG}"
      note: CHANGELOG.md
    when:
      - event: tag
