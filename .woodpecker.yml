steps:
  build-artifacts:
    image: golang:1.26-trixie
    environment:
      APP_VERSION: ${CI_COMMIT_TAG}
    privileged: true
    volumes:
      - /opt/rfad-artifacts:/export
    commands:
      - chmod +x build_linux.sh
      - ./build_linux.sh --internal
      - cp -r bin/* /export/
      - |
        if [ ! -f "CHANGELOG.md" ]; then
          echo "$CI_COMMIT_MESSAGE" > CHANGELOG.md
        fi

  # ==========================================
  # === БЛОК 1: ТЕСТИРОВАНИЕ ARCH-LINUX ===
  # ==========================================

  test-cachyos-zst:
    image: cachyos/cachyos:latest
    commands:
      - pacman -Syu --noconfirm libx11 wayland harfbuzz fribidi mesa libdrm fontconfig
      - pacman -U --noconfirm bin/RFADLauncherLinux.pkg.tar.zst
      - ldd /usr/bin/RFADLauncherLinux | grep -q "not found" && { ldd /usr/bin/RFADLauncherLinux | grep "not found"; exit 1; } || echo "CachyOS ZST OK!"
    when: &test_conditions
      - event: [push, pull_request]
        evaluate: 'not (CI_COMMIT_MESSAGE contains "[skip tests]")'

  test-garuda-zst:
    image: archlinux:latest # База Garuda
    commands:
      - pacman -Syu --noconfirm libx11 wayland harfbuzz fribidi mesa libdrm fontconfig
      - pacman -U --noconfirm bin/RFADLauncherLinux.pkg.tar.zst
      - ldd /usr/bin/RFADLauncherLinux | grep -q "not found" && { exit 1; } || echo "Garuda ZST OK!"
    when: *test_conditions

  test-manjaro-zst:
    image: manjarolinux/base:latest
    commands:
      - pacman -Syu --noconfirm libx11 wayland harfbuzz fribidi mesa libdrm fontconfig
      - pacman -U --noconfirm bin/RFADLauncherLinux.pkg.tar.zst
      - ldd /usr/bin/RFADLauncherLinux | grep -q "not found" && { exit 1; } || echo "Manjaro ZST OK!"
    when: *test_conditions

  # ==========================================
  # === БЛОК 2: ТЕСТИРОВАНИЕ UBUNTU/DEBIAN ===
  # ==========================================

  test-ubuntu-deb:
    image: ubuntu:24.04
    environment:
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update && apt-get install -y ./bin/RFADLauncherLinux.deb
      - ldd /usr/bin/RFADLauncherLinux | grep -q "not found" && { exit 1; } || echo "Ubuntu DEB OK!"
    when: *test_conditions

  test-debian-deb:
    image: debian:12-slim
    environment:
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update && apt-get install -y ./bin/RFADLauncherLinux.deb
      - ldd /usr/bin/RFADLauncherLinux | grep -q "not found" && { exit 1; } || echo "Debian DEB OK!"
    when: *test_conditions

  # ==========================================
  # === БЛОК 3: ТЕСТИРОВАНИЕ FEDORA ===
  # ==========================================

  test-fedora-rpm:
    image: fedora:40
    commands:
      - dnf install -y ./bin/RFADLauncherLinux.rpm
      - ldd /usr/bin/RFADLauncherLinux | grep -q "not found" && { exit 1; } || echo "Fedora RPM OK!"
    when: *test_conditions

  # =====================================================================
  # === БЛОК 4: ГЕНЕРАЦИЯ GH Puckeges [rpm apt, pacman, AUR, Flatpak] ===
  # =====================================================================

  generate-aur-pkgbuild:
    image: alpine:latest
    commands:
      - apk add --no-cache coreutils curl
      - VERSION=${CI_COMMIT_TAG#v}
      - ZST_SHA=$(curl -sL "https://github.com/$CI_REPO/releases/download/${CI_COMMIT_TAG}/RFADLauncherLinux.pkg.tar.zst" | sha256sum | awk '{print $1}')
      - |
        cat <<EOF > bin/PKGBUILD
        pkgname=rfad-launcher-bin
        pkgver=${VERSION}
        pkgrel=1
        pkgdesc="Launcher for RFAD SE"
        arch=('x86_64')
        url="${CI_REPO_URL:-https://github.com/$CI_REPO}"
        license=('MIT')
        provides=('rfad-launcher')
        conflicts=('rfad-launcher')
        source=("https://github.com/$CI_REPO/releases/download/${CI_COMMIT_TAG}/RFADLauncherLinux.pkg.tar.zst")
        sha256sums=('${ZST_SHA}')

        package() {
            # makepkg автоматически распакует .zst архив, нам остается только скопировать файлы
            cp -r "\${srcdir}/usr" "\${pkgdir}/"
            cp -r "\${srcdir}/opt" "\${pkgdir}/" 2>/dev/null || true
        }
        EOF
      - echo "PKGBUILD успешно сгенерирован!"
    when:
      - event: tag

  publish-gh-pages-repos:
    image: ubuntu:24.04
    environment:
      GH_TOKEN:
        from_secret: github_token
    commands:
      - |
        set -e # Скрипт мгновенно остановится при любой ошибке
        echo "=== Проверка токена GitHub ==="
        if [ -z "$GH_TOKEN" ]; then
          echo "КРИТИЧЕСКАЯ ОШИБКА: Токен GitHub не передан!"
          exit 1
        fi

        apt-get update
        apt-get install -y git dpkg-dev apt-utils createrepo-c flatpak ostree pacman-package-manager zstd libarchive-tools

        git config --global user.email "ci-bot@rfad.local"
        git config --global user.name "CI Bot"

        echo "=> Клонирование репозитория..."
        git clone https://github.com/${CI_REPO}.git gh-pages-repo
        cd gh-pages-repo

        if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
          git checkout gh-pages
        else
          git checkout --orphan gh-pages
          git rm -rf .
        fi

        mkdir -p package

        # --- 1. APT Репозиторий ---
        echo "=> Генерация APT репозитория..."
        mkdir -p package/apt/pool/main package/apt/dists/stable/main/binary-amd64
        cp ../bin/RFADLauncherLinux.deb package/apt/pool/main/
        (
          cd package/apt
          # apt-ftparchive сам сгенерирует правильный файл Packages с контрольными суммами
          apt-ftparchive packages pool/main > dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages
          
          # Создаем базовый конфиг для Release
          cat <<EOF > apt-release.conf
          APT::FTPArchive::Release::Codename "stable";
          APT::FTPArchive::Release::Components "main";
          APT::FTPArchive::Release::Architectures "amd64";
          EOF
          
          # Генерируем полноценный Release файл с хешами
          apt-ftparchive -c apt-release.conf release dists/stable > dists/stable/Release
          rm apt-release.conf
        )

        # --- 2. RPM Репозиторий ---
        echo "=> Генерация RPM репозитория..."
        mkdir -p package/rpm
        cp ../bin/RFADLauncherLinux.rpm package/rpm/
        createrepo_c package/rpm/

        # --- 3. Pacman Репозиторий ---
        echo "=> Генерация Pacman репозитория..."
        mkdir -p package/pacman/x86_64
        cp ../bin/RFADLauncherLinux.pkg.tar.zst package/pacman/x86_64/
        (
          cd package/pacman/x86_64
          /bin/bash /usr/bin/repo-add rfad.db.tar.gz RFADLauncherLinux.pkg.tar.zst
        )

        # --- 4. Flatpak OSTree Репозиторий ---
        echo "=> Генерация Flatpak репозитория..."
        mkdir -p package/repo
        if [ ! -f "package/repo/config" ]; then
          ostree init --mode=archive-z2 --repo=package/repo
        fi
        flatpak build-import-bundle package/repo ../bin/RFADLauncherLinux-x86_64.flatpak
        flatpak build-update-repo package/repo

        cat <<EOF > package/repo/rfad-launcher.flatpakrepo
        [Flatpak Repo]
        Title=RFAD Launcher
        Url=https://kraito585.github.io/Rfad-launcher-linux-fork/package/repo/
        Homepage=https://github.com/Kraito585/Rfad-launcher-linux-fork
        IsSubset=false
        EOF

        # --- Финализация и отправка на GitHub ---
        echo "=> Отправка обновленных репозиториев на GitHub Pages..."
        git add package/
        git commit -m "Update Repositories for ${CI_COMMIT_TAG}" || echo "Нет изменений для коммита"

        # Отключаем любые попытки Git запросить пароль в консоли
        export GIT_TERMINAL_PROMPT=0

        # Выполняем прямой пуш, жестко внедряя токен прямо в URL команды
        git push https://x-access-token:${GH_TOKEN}@github.com/${CI_REPO}.git gh-pages
    when:
      - event: tag

  # ==========================================
  # === БЛОК 5: ПУБЛИКАЦИЯ GITHUB ===
  # ==========================================

  publish-github:
    image: alpine:latest
    environment:
      GH_TOKEN:
        from_secret: github_token
    commands:
      - apk add --no-cache github-cli
      - |
        # 1. Создаем релиз (если он уже существует, команда не упадет)
        gh release create "$CI_COMMIT_TAG" \
          --title "RFAD Launcher $CI_COMMIT_TAG" \
          --notes-file CHANGELOG.md || echo "Релиз уже существует, переходим к загрузке файлов..."

        # 2. Обычная строка вместо bash-массива (добавлен PKGBUILD)
        FILES="bin/RFADLauncherLinux bin/RFADLauncherLinux-x86_64.flatpak bin/RFADLauncherLinux.deb bin/RFADLauncherLinux.rpm bin/RFADLauncherLinux.pkg.tar.zst bin/PKGBUILD"

        # 3. Умная загрузка с 3 попытками для каждого файла
        for file in $FILES; do
          if [ ! -f "$file" ]; then
            echo "ВНИМАНИЕ: Файл $file не найден!"
            continue
          fi

          success=0
          for attempt in 1 2 3; do
            echo "=> Загрузка $file (Попытка $attempt/3)..."
            if gh release upload "$CI_COMMIT_TAG" "$file" --clobber; then
              echo "УСПЕХ: $file загружен!"
              success=1
              break
            else
              echo "ОШИБКА: Сбой загрузки $file. Ожидание 5 сек перед повтором..."
              sleep 5
            fi
          done

          if [ $success -eq 0 ]; then
            echo "КРИТИЧЕСКАЯ ОШИБКА: Не удалось загрузить $file после 3 попыток."
            exit 1
          fi
        done
    when:
      - event: tag
