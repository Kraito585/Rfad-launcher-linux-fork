steps:
  # === 1. ЭТАП СБОРКИ ===
  build-artifacts:
    image: ubuntu:24.04
    environment:
      DEBIAN_FRONTEND: noninteractive
      # Критично для корректной работы appimagetool внутри Docker
      APPIMAGE_EXTRACT_AND_RUN: "1"
    secrets: [GOOGLE_CREDENTIALS]
    commands:
      # 1. Установка базовых системных зависимостей (GTK4 и WebKitGTK 6.0)
      - apt-get update
      - apt-get install -y curl wget git build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      # 2. Установка свежей версии Node.js 20 (содержит npm и нужные функции для Nuxt)
      - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      - apt-get install -y nodejs

      # 3. Установка Go (версия 1.22+)
      - wget https://go.dev/dl/go1.22.5.linux-amd64.tar.gz
      - tar -C /usr/local -xzf go1.22.5.linux-amd64.tar.gz
      - export PATH=$PATH:/usr/local/go/bin:$HOME/go/bin

      # 4. Установка Wails v3 CLI
      - go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      # 5. Подготовка секретов
      - mkdir -p embed
      - echo "$GOOGLE_CREDENTIALS" > embed/credentials.json

      # 6. Генерация иконок и полная сборка всех пакетов (AppImage, DEB, RPM, ZST)
      - wails3 task linux:package

      # 7. Гарантированное создание CHANGELOG.md
      - |
        if [ ! -f "CHANGELOG.md" ]; then
          echo "$CI_COMMIT_MESSAGE" > CHANGELOG.md
        fi

  # === 2. ЭТАП ТЕСТИРОВАНИЯ ЗАВИСИМОСТЕЙ ===

  test-arch:
    image: archlinux:latest
    commands:
      - pacman -Syu --noconfirm binutils
      - chmod +x bin/rfadlauncherlinux-x86_64.AppImage
      - cd bin && ./rfadlauncherlinux-x86_64.AppImage --appimage-extract
      - |
        if ldd squashfs-root/usr/bin/RFADLauncherLinux | grep -q "not found"; then
          echo "КРИТИЧЕСКАЯ ОШИБКА: В Arch Linux не хватает библиотек для AppImage!";
          ldd squashfs-root/usr/bin/RFADLauncherLinux | grep "not found";
          exit 1;
        else
          echo "AppImage успешно прошел проверку на Arch Linux (CachyOS ready)!";
        fi

  test-debian:
    image: debian:12-slim
    environment:
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update
      - apt-get install -y ./bin/RFADLauncherLinux.deb
      - |
        if ldd /usr/bin/RFADLauncherLinux | grep -q "not found"; then
          echo "КРИТИЧЕСКАЯ ОШИБКА: Отсутствуют зависимости!";
          ldd /usr/bin/RFADLauncherLinux | grep "not found";
          exit 1;
        else
          echo "Все зависимости DEB успешно разрешены!";
        fi

  test-fedora:
    image: fedora:40
    commands:
      - dnf install -y ./bin/RFADLauncherLinux.rpm
      - |
        if ldd /usr/bin/RFADLauncherLinux | grep -q "not found"; then
          echo "КРИТИЧЕСКАЯ ОШИБКА: Отсутствуют зависимости!";
          ldd /usr/bin/RFADLauncherLinux | grep "not found";
          exit 1;
        else
          echo "Все зависимости RPM успешно разрешены!";
        fi

  test-ubuntu:
    image: ubuntu:24.04
    environment:
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: "1"
    commands:
      - apt-get update
      - apt-get install -y binutils libc-bin
      - chmod +x bin/rfadlauncherlinux-x86_64.AppImage
      - cd bin && ./rfadlauncherlinux-x86_64.AppImage --appimage-extract
      - |
        if ldd squashfs-root/usr/bin/RFADLauncherLinux | grep -q "not found"; then
          echo "КРИТИЧЕСКАЯ ОШИБКА: В Ubuntu не хватает библиотек для AppImage!";
          ldd squashfs-root/usr/bin/RFADLauncherLinux | grep "not found";
          exit 1;
        else
          echo "AppImage успешно прошел проверку на Ubuntu!";
        fi

  # === 3. ЭТАП ПУБЛИКАЦИИ ===
  publish-github:
    image: woodpeckerci/plugin-release
    settings:
      api_key:
        from_secret: github_token
      files:
        - bin/RFADLauncherLinux
        - bin/rfadlauncherlinux-x86_64.AppImage
        - bin/RFADLauncherLinux.deb
        - bin/RFADLauncherLinux.rpm
        - bin/RFADLauncherLinux.pkg.tar.zst
      title: "RFAD Launcher ${CI_COMMIT_TAG}"
      note: CHANGELOG.md
    when:
      - event: tag
