steps:
  build-artifacts:
    image: ubuntu:24.04
    timeout: 2h
    environment:
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: "1"
    secrets: [GOOGLE_CREDENTIALS]
    commands:
      - apt-get update
      - apt-get install -y curl wget git build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev file
      - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      - apt-get install -y nodejs
      - wget https://go.dev/dl/go1.22.5.linux-amd64.tar.gz
      - tar -C /usr/local -xzf go1.22.5.linux-amd64.tar.gz
      - export PATH=$PATH:/usr/local/go/bin:$HOME/go/bin
      - go install github.com/wailsapp/wails/v3/cmd/wails3@latest
      - mkdir -p embed
      - echo "$GOOGLE_CREDENTIALS" > embed/credentials.json
      - wails3 task linux:package
      - cd bin
      - export APP_IMG=$(ls *.AppImage | head -n 1)
      - ./$APP_IMG --appimage-extract
      - mkdir -p squashfs-root/usr/lib/x86_64-linux-gnu/webkitgtk-6.0
      - cp -a /usr/lib/x86_64-linux-gnu/webkitgtk-6.0/* squashfs-root/usr/lib/x86_64-linux-gnu/webkitgtk-6.0/
      - wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
      - chmod +x appimagetool
      - ./appimagetool squashfs-root $APP_IMG
      - rm -rf squashfs-root appimagetool
      - cd ..

      - |
        if [ ! -f "CHANGELOG.md" ]; then
          echo "$CI_COMMIT_MESSAGE" > CHANGELOG.md
        fi

  # === 2. ЭТАП ТЕСТИРОВАНИЯ ЗАВИСИМОСТЕЙ ===
  test-cachyos:
    image: cachyos/cachyos:latest
    commands:
      # Устанавливаем графические либы, которые и так есть у десктопных пользователей
      - pacman -Syu --noconfirm libx11 wayland harfbuzz fribidi mesa libdrm fontconfig
      # Устанавливаем родной пакет ZST
      - pacman -U --noconfirm bin/RFADLauncherLinux.pkg.tar.zst
      - |
        if ldd /usr/bin/RFADLauncherLinux | grep -q "not found"; then
          echo "КРИТИЧЕСКАЯ ОШИБКА: Отсутствуют зависимости!";
          ldd /usr/bin/RFADLauncherLinux | grep "not found";
          exit 1;
        else
          echo "Все зависимости CachyOS успешно разрешены!";
        fi
    when:
      - event: [push, pull_request]
        evaluate: 'not (CI_COMMIT_MESSAGE contains "[skip tests]")'

  test-garuda:
    image: archlinux:latest # Официального образа Garuda нет, используем Arch как базу
    commands:
      - pacman -Syu --noconfirm libx11 wayland harfbuzz fribidi mesa libdrm fontconfig
      - pacman -U --noconfirm bin/RFADLauncherLinux.pkg.tar.zst
      - |
        if ldd /usr/bin/RFADLauncherLinux | grep -q "not found"; then
          echo "КРИТИЧЕСКАЯ ОШИБКА: Отсутствуют зависимости!";
          ldd /usr/bin/RFADLauncherLinux | grep "not found";
          exit 1;
        else
          echo "Все зависимости Garuda/Arch успешно разрешены!";
        fi
    when:
      - event: [push, pull_request]
        evaluate: 'not (CI_COMMIT_MESSAGE contains "[skip tests]")'

  test-debian:
    image: debian:12-slim
    environment:
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update
      - apt-get install -y ./bin/RFADLauncherLinux.deb
      - |
        if ldd /usr/bin/RFADLauncherLinux | grep -q "not found"; then
          echo "КРИТИЧЕСКАЯ ОШИБКА: Отсутствуют зависимости!";
          ldd /usr/bin/RFADLauncherLinux | grep "not found";
          exit 1;
        else
          echo "Все зависимости DEB успешно разрешены!";
        fi
    when:
      - event: [push, pull_request]
        evaluate: 'not (CI_COMMIT_MESSAGE contains "[skip tests]")'

  test-fedora:
    image: fedora:40
    commands:
      - dnf install -y ./bin/RFADLauncherLinux.rpm
      - |
        if ldd /usr/bin/RFADLauncherLinux | grep -q "not found"; then
          echo "КРИТИЧЕСКАЯ ОШИБКА: Отсутствуют зависимости!";
          ldd /usr/bin/RFADLauncherLinux | grep "not found";
          exit 1;
        else
          echo "Все зависимости RPM успешно разрешены!";
        fi
    when:
      - event: [push, pull_request]
        evaluate: 'not (CI_COMMIT_MESSAGE contains "[skip tests]")'

  test-ubuntu:
    image: ubuntu:24.04
    environment:
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update
      # Устанавливаем нативный DEB пакет. apt автоматически подтянет X11, Wayland и прочие зависимости.
      - apt-get install -y ./bin/RFADLauncherLinux.deb
      - |
        if ldd /usr/bin/RFADLauncherLinux | grep -q "not found"; then
          echo "КРИТИЧЕСКАЯ ОШИБКА: Отсутствуют зависимости!";
          ldd /usr/bin/RFADLauncherLinux | grep "not found";
          exit 1;
        else
          echo "Все зависимости Ubuntu успешно разрешены!";
        fi
    when:
      - event: [push, pull_request]
        evaluate: 'not (CI_COMMIT_MESSAGE contains "[skip tests]")'

  # === 3. ЭТАП ПУБЛИКАЦИИ ===
  publish-github:
    image: woodpeckerci/plugin-release
    settings:
      api_key:
        from_secret: github_token
      files:
        - bin/RFADLauncherLinux
        - bin/rfadlauncherlinux-x86_64.AppImage
        - bin/RFADLauncherLinux.deb
        - bin/RFADLauncherLinux.rpm
        - bin/RFADLauncherLinux.pkg.tar.zst
      title: "RFAD Launcher ${CI_COMMIT_TAG}"
      note: CHANGELOG.md
    when:
      - event: tag
